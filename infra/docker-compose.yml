name: kasgate

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: ../apps/gateway
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ../apps/web
      args:
        NEXT_PUBLIC_GATEWAY_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
        NEXT_PUBLIC_KASPA_NETWORK: ${KASPA_NETWORK}
    restart: unless-stopped
    environment:
      GATEWAY_INTERNAL_URL: http://gateway:8000
      KASGATE_COOKIE_SECURE: ${KASGATE_COOKIE_SECURE:-true}
      NEXT_PUBLIC_GATEWAY_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      NEXT_PUBLIC_KASPA_NETWORK: ${KASPA_NETWORK}
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-127.0.0.1}:3000:3000"

  # Optional own Kaspa node (rusty-kaspa) for the gateway's wRPC Borsh connection. Off unless the `node` profile
  # is enabled: docker compose --profile node up -d. Then set KASPA_RPC_URL=ws://kaspad:<KASPAD_RPC_BORSH_PORT>
  # in .env. The RPC port is only reachable on the compose network; only the P2P port is published.
  # Image: release build of kaspanet/rusty-kaspa v2.1.0 (source github.com/supertypo/docker-rusty-kaspa),
  # pinned by its multi-arch index digest. Sizing, firewall and upgrades: infra/node/README.md.
  kaspad:
    image: kaspanet/rusty-kaspad:v2.1.0@sha256:f85da74b9514584451f83a2cbea3aa93f700248302fe7e3e0ab17288f93c905b
    profiles: ["node"]
    restart: unless-stopped
    stop_grace_period: 2m
    environment:
      # kaspad reads its network from the environment: true = testnet-10 (netsuffix 10), false = mainnet.
      KASPAD_TESTNET: ${KASPAD_TESTNET:-true}
      KASPAD_NETSUFFIX: "10"
      KASPAD_RAM_SCALE: ${KASPAD_RAM_SCALE:-1.0}
    command:
      - kaspad
      - --yes
      - --nologfiles
      - --disable-upnp
      - --utxoindex
      - --appdir=/app/data
      - --listen=0.0.0.0:${KASPAD_P2P_PORT:-16211}
      - --rpclisten-borsh=0.0.0.0:${KASPAD_RPC_BORSH_PORT:-17210}
    volumes:
      - kaspad-data:/app/data
    expose:
      - "${KASPAD_RPC_BORSH_PORT:-17210}"
    ports:
      - "${KASPAD_P2P_PORT:-16211}:${KASPAD_P2P_PORT:-16211}/tcp"
    healthcheck:
      # busybox nc ships in the image; open Borsh port = RPC up (not necessarily synced: check isSynced via RPC).
      test: ["CMD-SHELL", "nc -z -w 3 127.0.0.1 ${KASPAD_RPC_BORSH_PORT:-17210}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  pgdata:
  redisdata:
  kaspad-data:
