[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = .
addopts = -m "not ratelimit"
markers =
    live: needs a running gateway (KASGATE_GATEWAY_URL, default http://localhost:8000)
    funded: needs KASGATE_TEST_PAYER_KEY, a funded testnet private key
    ratelimit: 429 tests; need RATE_LIMIT_ENABLED=true on the gateway and KASGATE_RATE_LIMIT_ENABLED=true here (run with -m ratelimit)
