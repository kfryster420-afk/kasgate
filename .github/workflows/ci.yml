name: CI

# Offline suites only: no funded wallet, no live gateway and no Kaspa node are needed.
# The gateway tests use an embedded PostgreSQL (pgserver) and fakeredis, so no service containers are required.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: Gateway (pytest, ruff, mypy --strict)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/gateway/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: pytest -q
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy --strict app

  python-packages:
    name: Buyer SDK and MCP server (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/*/pyproject.toml
      - name: Install dependencies
        run: pip install -e "packages/buyer-sdk[test]" -e "packages/mcp-server[test]"
      - name: Buyer SDK tests
        working-directory: packages/buyer-sdk
        run: pytest -q
      - name: MCP server tests
        working-directory: packages/mcp-server
        run: pytest -q

  integration-offline:
    name: Integration suite, offline tier
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Nothing listens here, so the live tiers skip and only the offline tests run.
      KASGATE_GATEWAY_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/integration/requirements.txt
            packages/*/pyproject.toml
      - name: Install dependencies
        run: pip install -e packages/buyer-sdk -e packages/mcp-server -r tests/integration/requirements.txt
      - name: Offline tests
        working-directory: tests/integration
        run: pytest -q -rs

  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
