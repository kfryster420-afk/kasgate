[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kasgate-mcp"
version = "0.1.0"
description = "MCP server (stdio) that lets AI agents browse and pay for KasGate endpoints with a capped KAS budget."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.27",
    "httpx>=0.27,<1.0",
    "kasgate-client>=0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pydantic-settings>=2.6,<3.0", "email-validator>=2.2,<3.0", "sqlalchemy[asyncio]>=2.0.36,<2.1"]

[project.scripts]
kasgate-mcp = "kasgate_mcp.server:main"

[tool.setuptools]
packages = ["kasgate_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
